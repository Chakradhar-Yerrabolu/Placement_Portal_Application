{% extends "base.html" %}

{% block title %}Company Registration - Placement Portal{% endblock %}

{% block content %}
<div class="form-container">

    <div class="form-header">
        <h1>Company Registration</h1>
        <p>Register your company to participate in campus placements.</p>
    </div>

    <form action="{{ url_for('company_register') }}" method="POST" class="registration-form">

        <!-- Company Details -->
        <div class="form-section">
            <h3>Company Details</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Company Name</label>
                    <input type="text" id="name" name="name" required placeholder="ABC Technologies Pvt Ltd">
                </div>

                <div class="form-group">
                    <label for="email">Official Email</label>
                    <input type="email" id="email" name="email" required placeholder="hr@abc.com">
                </div>

                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="text" id="phone" name="phone" required placeholder="+91 9876543210">
                </div>

                <div class="form-group">
                    <label for="website">Company Website</label>
                    <input type="url" id="website" name="website" required placeholder="https://www.abc.com">
                </div>
            </div>
        </div>

        <!-- Security -->
        <div class="form-section">
            <h3>Account Security</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </div>
        </div>

        <!-- Company Profile -->
        <div class="form-section">
            <h3>Company Profile</h3>

            <div class="form-group full-width">
                <label for="address">Company Address</label>
                <textarea id="address" name="address" rows="2" required
                          placeholder="Registered office address"></textarea>
            </div>

            <div class="form-group full-width">
                <label for="description">Company Description</label>
                <textarea id="description" name="description" rows="4" required
                          placeholder="Brief overview of company, domain, and hiring focus"></textarea>
            </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
            <button type="submit" class="role-button accent-btn">
                Submit for Approval
            </button>
            <p>
                Already registered?
                <a href="{{ url_for('company_login') }}">Login here</a>
            </p>
        </div>

    </form>

</div>
{% endblock %}
