{% extends "base.html" %}

{% block title %}Student Login - Placement Portal{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔐</div>
            <h1>Student Login</h1>
            <p>Welcome back! Please enter your details.</p>
        </div>

        <form action="{{ url_for('student_login') }}" method="POST" class="login-form">
            <div class="form-group">
                <label for="Student_email">Email Address</label>
                <input type="email" id="Student_email" name="Student_email" required placeholder="name@college.edu">
            </div>

            <div class="form-group">
                <label for="Student_password">Password</label>
                <input type="password" id="Student_password" name="Student_password" required placeholder="••••••••">
            </div>

            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember"> Remember me
                </label>
                <a href="{{url_for('student_forgot_password')}}" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="role-button">Login to Dashboard</button>
        </form>

        <div class="login-footer">
            <p>Don't have an account? <a href="{{ url_for('student_register') }}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
