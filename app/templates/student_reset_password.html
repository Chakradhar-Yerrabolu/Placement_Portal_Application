{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="update-profile-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Create New Password</h1>
            <p>Setting a new password for: <strong>{{ email }}</strong></p>
        </div>

        <form action="{{ url_for('student_reset_password', email=email) }}" method="POST" class="styled-form">
            <div class="form-section">
                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat new password" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="save-btn">Update Password</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Simple client-side check to make sure passwords match
    const form = document.querySelector('form');
    const pass = document.getElementById('new_password');
    const conf = document.getElementById('confirm_password');

    form.onsubmit = function(e) {
        if (pass.value !== conf.value) {
            alert("Passwords do not match!");
            e.preventDefault();
        }
    }
</script>
{% endblock %}
