{% extends "base.html" %}

{% block title %}Student Not Found - Placement Portal{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-card">
        <div class="error-icon">🔍</div>
        <h1>Student Not Found</h1>
        <p>We couldn't find a student with the ID you provided. They may have been removed or the link might be incorrect.</p>
        
        <div class="error-actions">
            <a href="{{ url_for('home') }}" class="role-button">Go to Home</a>
            <a href="javascript:history.back()" class="role-button admin-btn">Go Back</a>
        </div>
    </div>
</div>
{% endblock %}
