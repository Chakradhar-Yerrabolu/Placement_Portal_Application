{% extends "base.html" %}

{% block title %}Forgot Password - Placement Portal{% endblock %}

{% block content %}
<div class="update-profile-container">
    <div class="form-card">
        <div class="form-header">
            <h1>Forgot Your Password?</h1>
            <p>Enter your registered email address below to reset your password.</p>
        </div>

        <form action="{{ url_for('student_forgot_password') }}" method="POST" class="styled-form">
            <div class="form-section">
                <div class="form-group">
                    <label for="Student_email">Email Address</label>
                    <input type="email" id="Student_email" name="Student_email" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="save-btn">Send Reset Link</button>
                <a href="{{ url_for('student_login') }}" class="cancel-btn">Back to Login</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
