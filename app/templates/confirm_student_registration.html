{% extends "base.html" %}
{% block title %}Confirm Registration - Placement Portal{% endblock %}
{% block content %}
<div class="form-container" style="max-width:680px;text-align:center;margin:3rem auto;">
  <div style="font-size:3rem;margin-bottom:1rem;" aria-hidden="true">✉</div>
  <h1>Confirm your email</h1>
  <p>Confirm that you want to activate the Placement Portal account for <strong>{{ email }}</strong>.</p>
  <form method="POST" action="{{ url_for('confirm_student_registration', token=token) }}">
    <button class="role-button accent-btn" type="submit">Confirm email and activate account</button>
  </form>
  <p style="margin-top:1rem;color:#68778d;">If you did not request this account, close this page.</p>
</div>
{% endblock %}
